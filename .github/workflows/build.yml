name: Build RAT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20 || true
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Find APK
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          cp "$APK" output/rat.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: output/rat.apk
          retention-days: 1
          if-no-files-found: error
